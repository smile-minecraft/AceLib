# Gradle JVM 參數；paper-api artifact 體積適中，2GB 足夠。
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# 啟用 Gradle 設定快取與組態快取
org.gradle.configuration-cache=true
org.gradle.parallel=true

# 專案 toolchain 為 JDK 25（見 build.gradle.kts 的 JavaLanguageVersion.of(25)）。
# 此處僅示範如何覆寫自動偵測到的 JDK 路徑，避免 Gradle 選到不適當的版本。
# （Mac/Linux 共用此格式；實機路徑以 ~/.gradle/gradle.properties 或環境變數覆寫為主）
# 如需覆寫，請建立 ~/.gradle/gradle.properties 並設定：
#   org.gradle.java.installations.paths=/path/to/jdk-25