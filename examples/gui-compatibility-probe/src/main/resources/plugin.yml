# yaml-language-server: $schema=https://json.schemastore.org/bukkit-plugin.json
name: AceLibGuiCompatibilityProbe
main: com.example.acelibguiprobe.GuiCompatibilityProbePlugin
version: 1.0.0-SNAPSHOT
api-version: '26.1.2'
folia-supported: true
description: AceLib GUI 相容性探針：經隔離 GuiScope 執行導航／票券／輸入／冷卻／表單派送探針案例
authors:
  - Smile
load: POSTWORLD
depend:
  - AceLib
commands:
  gprobe:
    description: GUI 相容性探針指令（list / send / confirm / back / close）
    usage: /gprobe <list | send [player] [caseId] | confirm | back | close>
    permission: acelibguiprobe.use
permissions:
  acelibguiprobe.use:
    description: 使用 /gprobe 探針指令
    default: op
