# yaml-language-server: $schema=https://json.schemastore.org/bukkit-plugin.json
name: AceLib
# 注意：version 與 build.gradle.kts 的 version 欄位需手動同步。
# Phase 0 為了避免 Gradle 8+ configuration cache 與 token filter 衝突，
# 採硬編碼方式；Phase 1+ 若需動態注入可改用 expand() 或自訂 task。
version: 1.4.0-SNAPSHOT
main: com.smile.acelib.AceLibPlugin
api-version: '26.1.2'
folia-supported: true
description: AceLib - Folia-first base library for Smile Minecraft plugins
authors:
  - Smile
load: POSTWORLD
depend: []
# 四個外部整合皆為可選：缺席時 AceLib 以 reflection-only 探測安全降級（零影響）。
# softdepend 同時授予 AceLib 的 plugin classloader 對這些依賴插件 API class 的可見性
# （現代 Paper 採 access-backed classloader group，僅對宣告的 depend/softdepend 開放），
# 否則即使改用正確的 plugin classloader 也看不到 marker class。
softdepend: [floodgate, Vault, LuckPerms, PlaceholderAPI]
# 逐玩家儲存預設使用 SQLite，需要 JDBC driver。版本與 build.gradle.kts 的
# testImplementation("org.xerial:sqlite-jdbc") 固定一致，確保測試與運行期行為相同。
# Paper 會在首次啟動時從 Maven Central（Paper mirror）自動下載到
# libraries/；離線環境請事先把該 jar 放進 libraries/，否則玩家資料服務會以
# ACELIB-DATA-012 拒絕啟動（不影響 AceLib 其他功能）。
# 不使用 Paper 內建的 sqlite-jdbc：官方標註為 eventually to be removed。
libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0
# v1.4.0 起指令改經 Paper Brigadier 生命週期註冊（LifecycleEvents.COMMANDS），
# 不再需要 commands 宣告；acelib.admin 權限節點保留（requires＋dispatch 共用）。
permissions:
  acelib.admin:
    description: 存取 AceLib 管理指令（/acelib status 等）
    default: op
