# yaml-language-server: $schema=https://json.schemastore.org/bukkit-plugin.json
name: AceLib
# 注意：version 與 build.gradle.kts 的 version 欄位需手動同步。
# Phase 0 為了避免 Gradle 8+ configuration cache 與 token filter 衝突，
# 採硬編碼方式；Phase 1+ 若需動態注入可改用 expand() 或自訂 task。
version: 0.1.0-SNAPSHOT
main: com.smile.acelib.AceLibPlugin
api-version: '26.1.2'
folia-supported: true
description: AceLib - Folia-first base library for Smile Minecraft plugins
authors:
  - Smile
load: POSTWORLD
depend: []
commands:
  acelib:
    description: AceLib 管理指令根節點
    aliases:
      - alib
    usage: /acelib <status>
    permission: acelib.admin
    permission-message: 沒有權限執行此指令
permissions:
  acelib.admin:
    description: 存取 AceLib 管理指令（/acelib status 等）
    default: op
