name: CI

# 最小權限：本 workflow 只讀取 repository 內容，不需要寫入權限。
permissions:
  contents: read

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    name: Build & Test (Java 25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build and test
        run: ./gradlew build --no-daemon
      # 文件品質門禁：doclint/javadoc、publication、consumer fixture docs、
      # API surface/signature/docs coverage 全在 docsCheck 內 fail-closed 聚合。
      - name: Docs quality gate (docsCheck)
        run: ./gradlew docsCheck --no-daemon
      # 保留 HTML Javadoc artifact 供下載檢視；上傳不需寫入權限，維持 contents: read。
      - name: Upload HTML Javadoc
        uses: actions/upload-artifact@v7
        with:
          name: javadoc-html
          path: build/docs/javadoc
          if-no-files-found: error

  publish-check:
    name: Publish artifacts check (Java 25, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # 驗證 publishToMavenLocal 能產出 binary / POM / sources / javadoc，
      # 並檢查座標與版本一致性。此 job 不推送任何外部 repository，亦不含 secrets。
      - name: Verify publishable artifacts
        run: ./gradlew publishToMavenLocal verifyPublication --no-daemon

  # 雙版本相容矩陣聚合 gate。
  # PR CI 只跑 fast / deterministic 的 binary / unit / artifact gate：
  #   - Adventure 4.26.1 與 5.2.0 isolated tests（test task 內含）
  #   - API surface / signature / boundary gates（test task 內含）
  #   - artifact gate（Java 25 bytecode、min api-version 26.1.2、plugin descriptor
  #     一致性、無 bundled server API、無 optional eager linkage、API surface 存在）
  #   - publication 與 build（verifyPublication + jar）
  #   - 各 lane exact resolved versions（compatibilityMatrix 輸出到 log）
  # 真實 Paper/Folia 26.1.2/26.2 runtime smoke 由 compatibility-nightly.yml 承擔，
  # 本 job 不啟動任何 server（不依賴真實 Bedrock / 共享 server / 外部 secret）。
  compatibility:
    name: Compatibility matrix gate (Adventure 4/5 + artifact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Compatibility matrix check
        run: ./gradlew compatibilityCheck --no-daemon --console=plain
      # 顯式跑 artifact gate 測試，確保該 lane 在 PR 一定被執行（非僅含於 test）。
      - name: Artifact compatibility gate test
        run: ./gradlew test --tests 'com.smile.acelib.compatibility.ArtifactCompatibilityGateTest' --no-daemon --console=plain
