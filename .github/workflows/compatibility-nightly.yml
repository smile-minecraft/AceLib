name: Compatibility Nightly (server runtime matrix)

# ⚠️ 狀態：本 workflow 僅被「建立」，未實際執行。
#   - on: workflow_dispatch 需手動觸發，且本 task 不觸發任何 run。
#   - 它定義了 Paper / Folia 26.1.2 與 26.2 的 runtime smoke 矩陣，
#     但 26.2 的 exact SHA-256 / build 由 後續 runtime qualification 提供。
#   - 在 後續 runtime qualification 提供之前，26.2 lane 以 fail-closed 方式拒絕（exit 1），
#     不會靜默通過，也不會產生「已支援 26.2」的假象。
#   - PR CI（ci.yml 的 compatibility job）只跑 fast / deterministic 的
#     binary / unit / artifact gate，不啟動任何 server。
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      paper_26_2_sha256:
        description: 'Paper 26.2 artifact SHA-256（後續 runtime qualification 提供；空白則 26.2 lane 失敗）'
        required: false
        default: ''
      paper_26_2_build:
        description: 'Paper 26.2 build 編號（後續 runtime qualification 提供）'
        required: false
        default: ''
      folia_26_2_sha256:
        description: 'Folia 26.2 artifact SHA-256（後續 runtime qualification 提供；空白則 26.2 lane 失敗）'
        required: false
        default: ''
      folia_26_2_build:
        description: 'Folia 26.2 build 編號（後續 runtime qualification 提供）'
        required: false
        default: ''

jobs:
  paper-26-1-2:
    name: Server smoke paper 26.1.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build AceLib jar
        run: ./gradlew jar --no-daemon
      - name: Paper 26.1.2 runtime smoke
        run: scripts/smoke-server.sh paper --download --log-dir "${{ runner.temp }}/smoke-paper-26.1.2"

  folia-26-1-2:
    name: Server smoke folia 26.1.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build AceLib jar
        run: ./gradlew jar --no-daemon
      - name: Folia 26.1.2 runtime smoke
        run: scripts/smoke-server.sh folia --download --log-dir "${{ runner.temp }}/smoke-folia-26.1.2"

  paper-26-2:
    name: Server smoke paper 26.2 (requires runtime qualification SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail closed if 26.2 SHA not provided
        if: ${{ github.event.inputs.paper_26_2_sha256 == '' || github.event.inputs.paper_26_2_build == '' }}
        run: |
          echo "::error::Paper 26.2 lane 需要 後續 runtime qualification 提供的 exact SHA-256 與 build 編號；"
          echo "::error::在提供之前本 lane 故意失敗，避免靜默通過或產生「已支援 26.2」的假象。"
          exit 1
      - name: Set up JDK 25
        if: ${{ github.event.inputs.paper_26_2_sha256 != '' && github.event.inputs.paper_26_2_build != '' }}
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        if: ${{ github.event.inputs.paper_26_2_sha256 != '' && github.event.inputs.paper_26_2_build != '' }}
        run: chmod +x gradlew
      - name: Build AceLib jar
        if: ${{ github.event.inputs.paper_26_2_sha256 != '' && github.event.inputs.paper_26_2_build != '' }}
        run: ./gradlew jar --no-daemon
      - name: Paper 26.2 runtime smoke
        if: ${{ github.event.inputs.paper_26_2_sha256 != '' && github.event.inputs.paper_26_2_build != '' }}
        run: scripts/smoke-server.sh paper --version 26.2 --build "${{ github.event.inputs.paper_26_2_build }}" --sha256 "${{ github.event.inputs.paper_26_2_sha256 }}" --download --log-dir "${{ runner.temp }}/smoke-paper-26.2"

  folia-26-2:
    name: Server smoke folia 26.2 (requires runtime qualification SHA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail closed if 26.2 SHA not provided
        if: ${{ github.event.inputs.folia_26_2_sha256 == '' || github.event.inputs.folia_26_2_build == '' }}
        run: |
          echo "::error::Folia 26.2 lane 需要 後續 runtime qualification 提供的 exact SHA-256 與 build 編號；"
          echo "::error::在提供之前本 lane 故意失敗，避免靜默通過或產生「已支援 26.2」的假象。"
          exit 1
      - name: Set up JDK 25
        if: ${{ github.event.inputs.folia_26_2_sha256 != '' && github.event.inputs.folia_26_2_build != '' }}
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        if: ${{ github.event.inputs.folia_26_2_sha256 != '' && github.event.inputs.folia_26_2_build != '' }}
        run: chmod +x gradlew
      - name: Build AceLib jar
        if: ${{ github.event.inputs.folia_26_2_sha256 != '' && github.event.inputs.folia_26_2_build != '' }}
        run: ./gradlew jar --no-daemon
      - name: Folia 26.2 runtime smoke
        if: ${{ github.event.inputs.folia_26_2_sha256 != '' && github.event.inputs.folia_26_2_build != '' }}
        run: scripts/smoke-server.sh folia --version 26.2 --build "${{ github.event.inputs.folia_26_2_build }}" --sha256 "${{ github.event.inputs.folia_26_2_sha256 }}" --download --log-dir "${{ runner.temp }}/smoke-folia-26.2"
